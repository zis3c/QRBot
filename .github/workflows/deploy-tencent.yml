name: Deploy QRBot to Tencent

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-qrbot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy project files to Tencent
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "."
          target: "/tmp/qrbot-deploy"
          rm: true
          strip_components: 0

      - name: Install dependencies and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            set -e

            mkdir -p /opt/qrbot
            rsync -a --delete \
              --exclude ".venv/" \
              --exclude "data/" \
              --exclude "*.db" \
              --exclude "bot_data.json" \
              --exclude "activity.log" \
              --exclude "bot.log" \
              /tmp/qrbot-deploy/ /opt/qrbot/

            chown -R deploy:deploy /opt/qrbot

            cd /opt/qrbot
            rm -f bot.log
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt

            rm -rf /tmp/qrbot-deploy

            sudo -n /usr/bin/systemctl daemon-reload
            sudo -n /usr/bin/systemctl restart qrbot.service
            sudo -n /usr/bin/systemctl is-active --quiet qrbot.service
